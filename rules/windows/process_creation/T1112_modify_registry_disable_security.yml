title: Registry Tampering To Disable Security Controls
id: 60110afe-24fb-535f-9045-3c08c1805fae
status: experimental
description: Detects reg.exe writes that disable UAC, Defender, or SmartScreen via known security-relevant registry values (Atomic T1112).
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1112/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\reg.exe'
        CommandLine|contains: ' add '
    selection_values:
        CommandLine|contains:
            - 'EnableLUA'
            - 'DisableAntiSpyware'
            - 'DisableRealtimeMonitoring'
            - 'SmartScreenEnabled'
            - 'ConsentPromptBehaviorAdmin'
    selection_disable:
        CommandLine|contains:
            - ' /d 0'
            - ' /d 1'
            - 'Off'
    condition: selection and selection_values and selection_disable
falsepositives:
    - Hardening or imaging scripts that intentionally set these values (should be reviewed and allow-listed).
level: high
