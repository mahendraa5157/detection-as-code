title: Remote Desktop Enabled Via Registry From Command Line
id: 27f36d1a-a5ce-5730-9daf-b97a1574fd4c
status: experimental
description: Detects enabling RDP by flipping fDenyTSConnections via reg.exe, used for lateral movement (Atomic T1021.001).
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1021/001/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.lateral_movement
    - attack.t1021.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\reg.exe'
        CommandLine|contains|all:
            - 'fDenyTSConnections'
            - 'Terminal Server'
        CommandLine|contains:
            - ' 0'
    condition: selection
falsepositives:
    - IT enabling RDP during provisioning via a configuration script.
level: medium
