title: System Information Discovery Via Systeminfo
id: c8cc1a1d-082e-5097-9c9c-a600c641f85f
status: experimental
description: Detects host enumeration via systeminfo.exe and related commands (Atomic T1082).
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1082/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.discovery
    - attack.t1082
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\\systeminfo.exe'
            - '\\hostname.exe'
    condition: selection
falsepositives:
    - Inventory and asset-management tooling.
    - Support staff gathering host details.
level: low
