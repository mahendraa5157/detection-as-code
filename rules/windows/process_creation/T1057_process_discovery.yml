title: Process Discovery Via Tasklist Or Get-Process
id: 6221dd8e-7120-513c-ad45-9c2bba494548
status: experimental
description: Detects process enumeration via tasklist or PowerShell Get-Process (Atomic T1057).
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1057/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.discovery
    - attack.t1057
logsource:
    category: process_creation
    product: windows
detection:
    selection_tasklist:
        Image|endswith: '\\tasklist.exe'
    selection_ps:
        Image|endswith:
            - '\\powershell.exe'
            - '\\pwsh.exe'
        CommandLine|contains: 'Get-Process'
    condition: selection_tasklist or selection_ps
falsepositives:
    - Monitoring agents and admin scripts that enumerate processes regularly.
level: low
