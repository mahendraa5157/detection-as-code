title: Regsvr32 Squiblydoo Scriptlet Execution
id: 2d6e8bc9-aaaa-582c-aa9a-65aa1131be9a
status: experimental
description: Detects the regsvr32 'Squiblydoo' technique using scrobj.dll with a remote scriptlet (Atomic T1218.010).
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1218/010/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.defense_evasion
    - attack.t1218.010
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\regsvr32.exe'
    selection_scrobj:
        CommandLine|contains:
            - 'scrobj.dll'
            - '/i:http'
            - '.sct'
    condition: selection and selection_scrobj
falsepositives:
    - Legitimate COM scriptlet registration (very rare in modern environments).
level: high
