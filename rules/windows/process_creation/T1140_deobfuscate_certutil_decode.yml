title: Deobfuscate/Decode Files Via Certutil Decode
id: a0e048e2-188d-5e5b-8b34-469d93164309
status: experimental
description: Detects certutil -decode / -decodehex used to reconstruct a payload from an encoded file (Atomic T1140).
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1140/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.defense_evasion
    - attack.t1140
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\certutil.exe'
        CommandLine|contains:
            - '-decode'
            - '-decodehex'
    condition: selection
falsepositives:
    - Rare legitimate certificate workflows that base64-decode files.
level: medium
