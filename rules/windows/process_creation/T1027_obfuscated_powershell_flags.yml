title: Obfuscated PowerShell Via Stacked Evasion Flags
id: 33ff9fd2-5ca0-56c6-bf16-8d682d6f2156
status: experimental
description: Detects PowerShell launched with stacked evasion flags (hidden window, bypass execution policy, no profile) typical of malicious loaders (Atomic T1027).
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1027/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_proc:
        Image|endswith:
            - '\\powershell.exe'
            - '\\pwsh.exe'
    selection_hidden:
        CommandLine|contains:
            - '-w hidden'
            - '-windowstyle hidden'
            - '-win h'
    selection_bypass:
        CommandLine|contains:
            - '-ep bypass'
            - '-exec bypass'
            - 'executionpolicy bypass'
    condition: selection_proc and selection_hidden and selection_bypass
falsepositives:
    - Some legitimate deployment tools run hidden with bypass policy; validate the script source.
level: medium
