title: Scheduled Task Creation Via Schtasks
id: 3cf9254b-fed6-56c5-ae68-392f20399005
status: experimental
description: Detects creation of scheduled tasks via schtasks.exe, used by Atomic T1053.005 for persistence.
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1053/005/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\schtasks.exe'
        CommandLine|contains: ' /create '
    filter_known:
        CommandLine|contains:
            - 'Microsoft\\Windows\\UpdateOrchestrator'
            - 'GoogleUpdateTask'
            - 'MicrosoftEdgeUpdate'
            - 'OneDrive Standalone Update'
    condition: selection and not filter_known
falsepositives:
    - Legitimate software installers (Chrome, Edge, OneDrive) registering update tasks.
    - IT automation creating maintenance jobs.
level: medium
