title: Inhibit System Recovery Via Shadow Copy Deletion
id: da29060d-2a50-5d1f-9a16-d805c6239c59
status: experimental
description: Detects deletion of volume shadow copies and recovery via vssadmin, wmic shadowcopy, or wbadmin (Atomic T1490), a ransomware precursor.
references:
    - https://github.com/mahendraa5157/detection-as-code
    - https://attack.mitre.org/techniques/T1490/
author: mahendra / Detection-as-Code Lab
date: 2026/11/15
tags:
    - attack.impact
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection_vssadmin:
        Image|endswith: '\\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    selection_wmic:
        Image|endswith: '\\wmic.exe'
        CommandLine|contains|all:
            - 'shadowcopy'
            - 'delete'
    selection_wbadmin:
        Image|endswith: '\\wbadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'catalog'
    condition: selection_vssadmin or selection_wmic or selection_wbadmin
falsepositives:
    - Backup software that rotates shadow copies (verify against the known backup product).
level: high
